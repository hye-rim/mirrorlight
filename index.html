<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>거울 빛</title>
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#070b16; color:#e8f0ff; touch-action:manipulation;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #app { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); gap:8px; }
  #bar { width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #bar .t { text-align:center; flex:1; line-height:1.25; }
  #bar .t b { font-size:16px; display:block; }
  #bar .t span { font-size:12px; color:#8fa6d0; }
  button { font:inherit; color:inherit; cursor:pointer; border:none; }
  .ib { background:#16213d; border:1px solid #2c3d6b; border-radius:12px; padding:9px 12px; font-size:14px; font-weight:700; min-width:44px; min-height:44px; }
  .ib:active { background:#22335f; }
  .ib:disabled { opacity:.35; }
  #boardWrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { display:block; touch-action:manipulation; border-radius:14px; box-shadow:0 0 0 1px #243258, 0 10px 40px rgba(0,0,0,.5); }
  #foot { width:100%; max-width:560px; display:flex; gap:8px; }
  #foot .ib { flex:1; }
  #msg { height:20px; font-size:13px; color:#9fe8ff; text-align:center; }
  .ov { position:absolute; inset:0; background:rgba(5,8,18,.94); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:12px; padding:16px; text-align:center; overflow:auto; z-index:5; }
  .ov > :first-child { margin-top:auto; } .ov > :last-child { margin-bottom:auto; }
  .ov.hidden { display:none; }
  .ov h1 { font-size:34px; font-weight:900; color:#9fe8ff; text-shadow:0 0 18px #3ad0ff88; }
  .ov h2 { font-size:22px; }
  .ov p { font-size:14px; line-height:1.55; color:#b8c8e8; max-width:340px; }
  .ov p b { color:#ffe08a; }
  .big { background:linear-gradient(180deg,#9fe8ff,#2aa6e8); color:#04202e; font-weight:900; font-size:17px; border-radius:999px; padding:12px 30px; box-shadow:0 3px 0 #146a96; }
  .big:active { transform:translateY(2px); box-shadow:0 1px 0 #146a96; }
  .sub { background:#16213d; border:1px solid #2c3d6b; border-radius:999px; padding:9px 18px; font-size:14px; font-weight:700; }
  #stars { font-size:40px; letter-spacing:6px; color:#ffd24a; text-shadow:0 0 14px #ffb30088; }
  #worlds { width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; text-align:left; }
  #worlds h3 { font-size:14px; color:#8fa6d0; margin-bottom:6px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .lv { background:#16213d; border:1px solid #2c3d6b; border-radius:12px; padding:8px 0 6px; font-weight:800; font-size:17px; line-height:1.2; min-height:54px; }
  .lv small { display:block; font-size:11px; color:#ffd24a; letter-spacing:1px; min-height:14px; }
  .lv.locked { opacity:.35; pointer-events:none; }
  .lv.cur { border-color:#9fe8ff; box-shadow:0 0 0 1px #9fe8ff; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="ib" id="btnMenu" aria-label="레벨 선택">☰</button>
    <div class="t"><b id="title">레벨 1</b><span id="sub">&nbsp;</span></div>
    <button class="ib" id="btnSound" aria-label="소리">🔊</button>
  </div>
  <div id="msg"></div>
  <div id="boardWrap"><canvas id="c" width="360" height="360"></canvas></div>
  <div id="foot">
    <button class="ib" id="btnUndo">↶ 되돌리기</button>
    <button class="ib" id="btnReset">↺ 처음으로</button>
    <button class="ib" id="btnHint">💡 힌트</button>
  </div>
</div>

<div class="ov" id="ovStart">
  <h1>🔦 거울 빛</h1>
  <p>레이저가 <b>수정</b>에 모두 닿게<br>거울을 <b>눌러서 돌리세요.</b></p>
  <button class="big" id="btnPlay">시작하기</button>
</div>
<div class="ov hidden" id="ovLevels">
  <h2>레벨 고르기</h2>
  <p id="totalStars"></p>
  <div id="worlds"></div>
  <button class="sub" id="btnCloseLevels">닫기</button>
</div>
<div class="ov hidden" id="ovWin">
  <h2 id="winTitle">해결!</h2>
  <div id="stars">★★★</div>
  <p id="winText"></p>
  <button class="big" id="btnNext">다음 레벨</button>
  <div style="display:flex;gap:8px"><button class="sub" id="btnAgain">다시 해 보기</button><button class="sub" id="btnWinMenu">레벨 고르기</button></div>
</div>
<script src="logic.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
